{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🏗️</div>
      <h2>Welcome Back</h2>
      <p class="auth-sub">Sign in to Construction Work Flow</p>
    </div>
    <form method="post" class="auth-form">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required placeholder="your@email.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button class="btn btn-full" type="submit">Login</button>
    </form>
  </div>
</div>
{% endblock %}
