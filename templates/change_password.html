{% extends 'base.html' %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">🔐</div>
      <h2>Change Password</h2>
      <p class="auth-sub">Update your account password</p>
    </div>
    <form method="post" class="auth-form">
      <div class="form-group">
        <label>Current Password</label>
        <input type="password" name="current_password" required placeholder="Enter current password" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label>New Password</label>
        <input type="password" name="new_password" required placeholder="Enter new password" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required placeholder="Re-enter new password" autocomplete="new-password">
      </div>
      <button class="btn btn-full" type="submit" style="margin-top:18px">Update Password</button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:13px; color:#888">
      <a href="{{ url_for('index') }}" style="color:#0b6e4f; text-decoration:none; font-weight:600">← Back to Home</a>
    </p>
  </div>
</div>
{% endblock %}
